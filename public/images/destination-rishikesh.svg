<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="mistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="cardShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#skyGrad)" />
  
  <!-- Sun / Moon Glow -->
  <circle cx="600" cy="180" r="108" fill="#ffffff" opacity="0.3" filter="blur(20px)" />
  <circle cx="600" cy="180" r="48" fill="#fffbeb" opacity="0.85" />

  <!-- Far Distant Snowy Peaks -->
  <polygon points="0,360 160,192 320,348 520,168 680,312 800,228 800,600 0,600" fill="#0f766e" opacity="0.85" />
  
  <!-- Snow caps -->
  <polygon points="120,240 160,192 208,252 176,240 144,252" fill="#ffffff" opacity="0.9" />
  <polygon points="480,216 520,168 576,228 544,210 504,228" fill="#ffffff" opacity="0.9" />

  <!-- Mid Ridge with Misty Atmospheric Layer -->
  <path d="M0,330 Q240,270 440,348 T800,312 L800,600 L0,600 Z" fill="#047857" opacity="0.8" />
  <rect y="270" width="800" height="150" fill="url(#mistGrad)" />

  <!-- Pine Tree Ridge & Silhouettes -->
  <g fill="#047857">
    <!-- Trees left to right -->
    <polygon points="0,450 25,348 50,450" /><polygon points="40,450 65,348 90,450" /><polygon points="80,450 105,348 130,450" /><polygon points="120,450 145,348 170,450" /><polygon points="160,450 185,348 210,450" /><polygon points="200,450 225,348 250,450" /><polygon points="240,450 265,348 290,450" /><polygon points="280,450 305,348 330,450" /><polygon points="320,450 345,348 370,450" /><polygon points="360,450 385,348 410,450" /><polygon points="400,450 425,348 450,450" /><polygon points="440,450 465,348 490,450" /><polygon points="480,450 505,348 530,450" /><polygon points="520,450 545,348 570,450" /><polygon points="560,450 585,348 610,450" /><polygon points="600,450 625,348 650,450" /><polygon points="640,450 665,348 690,450" /><polygon points="680,450 705,348 730,450" /><polygon points="720,450 745,348 770,450" /><polygon points="760,450 785,348 810,450" />
  </g>

  <!-- Foreground Hill / Resort Terrace Deck -->
  <path d="M0,432 Q320,390 800,456 L800,600 L0,600 Z" fill="#047857" />

  <!-- Wooden Resort Cottage Silhouette with Warm Glowing Windows -->
  <g transform="translate(96, 372)">
    <!-- Cottage Roof -->
    <polygon points="0,50 80,0 160,50" fill="#292524" />
    <rect x="15" y="50" width="130" height="70" fill="#44403c" />
    <!-- Warm Lit Windows -->
    <rect x="30" y="65" width="30" height="35" rx="3" fill="#fef08a" opacity="0.95" />
    <rect x="70" y="65" width="30" height="35" rx="3" fill="#fef08a" opacity="0.95" />
    <rect x="110" y="70" width="22" height="50" rx="2" fill="#78350f" />
    <!-- Porch Railing -->
    <line x1="5" y1="110" x2="155" y2="110" stroke="#a8a29e" stroke-width="3" />
    <!-- Balcony Warm Glow -->
    <circle cx="45" cy="82" r="14" fill="#fbbf24" opacity="0.4" />
    <circle cx="85" cy="82" r="14" fill="#fbbf24" opacity="0.4" />
  </g>

  <!-- Vignette Gradient for Crisp Legible Text -->
  <rect width="800" height="600" fill="url(#cardShadow)" />

  <!-- Typography Overlay -->
  <text x="48" y="491" font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="1.5">RISHIKESH</text>
  <text x="48" y="534" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#facc15" letter-spacing="2.5">Yoga Capital · Ganga Aarti · White River Rafting</text>
  <text x="48" y="564" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#e2e8f0" letter-spacing="1">BON HOLIDAYS · HANDPICKED UTTARAKHAND EXPERIENCES</text>
</svg>